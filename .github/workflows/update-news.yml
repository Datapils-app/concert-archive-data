name: Update news

on:
  schedule:
    - cron: "17 5,17 * * *"   # twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect news
        run: python scripts/update_news.py
      - name: Push notification (optional)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ] && [ -f new_important.txt ]; then
            curl -s -H "Title: Archive nieuws" -d "$(cat new_important.txt)" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
          rm -f new_important.txt
      - name: Commit changes
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news" && git push
